info:
  name: Create comment
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/projects/{{project_id}}/tasks/{{task_id}}/comments"
  body:
    type: json
    data: |-
      {
        "content": "Very useful comment !"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
