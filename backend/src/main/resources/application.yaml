spring:
  application:
    name: mini-jira
  
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/devboard
    username: devboard
    password: devboard
  
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: read:user,user:email

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
