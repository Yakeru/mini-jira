spring:
  application:
    name: mini-jira
  
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/devboard
    username: devboard
    password: devboard

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${MINI-JIRA_GITHUB_CLIENT_ID:client-id-missing}
            client-secret: ${MINI-JIRA_GITHUB_CLIENT_SECRET:client-secret-missing}
            scope: read:user,user:email

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

mini-jira:
  jwt:
    secret: ${MINI-JIRA_JWT_SECRET:mini-jira-secret-missing}
    expiration-hours: 24
  frontend:
    url: ${MINI-JIRA_FRONTEND_URL:http://localhost:4200}
